<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encurtador de Links - QR Studio</title>
    <!-- Dependências de Estilo (mesmas do projeto principal) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Mesma cor de fundo do app principal */
        }
        /* Efeito de pulsação para o resultado */
        @keyframes pulse-bg {
            0%, 100% { background-color: #f0f9ff; }
            50% { background-color: #e0f2fe; }
        }
        .result-pulse {
            animation: pulse-bg 1.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 text-slate-800">

    <!-- Notification Toast System -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Card Principal do Encurtador -->
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-2xl p-6 md:p-10">
        
        <!-- Cabeçalho -->
        <div class="flex items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg shadow-blue-100">
                    <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Encurtador de Links</h1>
                    <p class="text-sm text-slate-500 font-medium">Transforme URLs longas em links curtos</p>
                </div>
            </div>
            <a href="index.html" class="flex-shrink-0 text-sm font-semibold text-slate-500 hover:text-blue-600 transition flex items-center gap-1.5" title="Voltar ao QR Studio">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Voltar</span>
            </a>
        </div>

        <!-- Área de Input -->
        <div class="space-y-4">
            <div>
                <label for="long-url" class="block text-sm font-semibold text-slate-700 mb-1.5">Cole a URL longa aqui:</label>
                <input type="url" id="long-url" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm shadow-sm" placeholder="https://exemplo.com/um/caminho/muito/longo/para/ser/compartilhado..." />
            </div>

            <button id="shorten-btn" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold shadow-xl hover:bg-slate-800 transition transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <span id="btn-text">Encurtar Link</span>
                <i id="btn-icon" class="fa-solid fa-scissors"></i>
            </button>
        </div>

        <!-- Área de Resultado -->
        <div id="result-area" class="hidden mt-6 p-4 bg-sky-50 border-2 border-dashed border-sky-200 rounded-2xl">
            <label class="block text-xs font-bold uppercase tracking-wider text-sky-700 mb-2">Seu link curto está pronto!</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="short-url" readonly class="flex-grow px-4 py-3 bg-white rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 outline-none" />
                <div class="flex gap-2">
                    <button id="copy-btn" class="flex-1 sm:flex-none w-full py-3 px-5 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-500 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-copy"></i> Copiar
                    </button>
                    <button id="qr-btn" class="flex-1 sm:flex-none w-full py-3 px-5 bg-emerald-600 text-white rounded-xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-500 transition flex items-center justify-center gap-2" title="Gerar QR Code com este link">
                        <i class="fa-solid fa-qrcode"></i> QR Code
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const longUrlInput = document.getElementById('long-url');
        const shortenBtn = document.getElementById('shorten-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const resultArea = document.getElementById('result-area');
        const shortUrlInput = document.getElementById('short-url');
        const copyBtn = document.getElementById('copy-btn');
        const qrBtn = document.getElementById('qr-btn');

        // Função para exibir notificações (mesma do app principal)
        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `flex items-center gap-2 p-4 mb-2 rounded-2xl shadow-xl border text-sm font-semibold pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 ${
                type === "error" 
                ? "bg-rose-50 text-rose-800 border-rose-100" 
                : "bg-emerald-50 text-emerald-800 border-emerald-100"
            }`;
            const icon = type === "error" 
                ? '<i class="fa-solid fa-circle-exclamation text-rose-500 text-lg"></i>' 
                : '<i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>';
            toast.innerHTML = `${icon} <span class="flex-1">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove("translate-y-2", "opacity-0"); }, 10);
            setTimeout(() => {
                toast.classList.add("translate-y-2", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Função principal para encurtar a URL
        async function shortenUrl() {
            const longUrl = longUrlInput.value.trim();

            // Validação simples
            if (!longUrl || !longUrl.startsWith('http')) {
                showToast("Por favor, insira uma URL válida (começando com http:// ou https://)", "error");
                return;
            }

            // Estado de carregamento
            shortenBtn.disabled = true;
            btnText.textContent = 'Encurtando...';
            btnIcon.className = 'fa-solid fa-spinner fa-spin';
            resultArea.classList.add('hidden');

            try {
                // A "mágica" do backend acontece aqui, chamando a API do TinyURL
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                
                if (!response.ok) {
                    throw new Error('Falha ao conectar com o serviço de encurtamento.');
                }

                const shortUrl = await response.text();

                // Exibe o resultado
                shortUrlInput.value = shortUrl;
                resultArea.classList.remove('hidden');
                resultArea.classList.add('result-pulse');
                setTimeout(() => resultArea.classList.remove('result-pulse'), 1500);

            } catch (error) {
                showToast(error.message || "Ocorreu um erro desconhecido.", "error");
            } finally {
                // Restaura o botão
                shortenBtn.disabled = false;
                btnText.textContent = 'Encurtar Link';
                btnIcon.className = 'fa-solid fa-scissors';
            }
        }

        // Função para copiar o link
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(shortUrlInput.value).then(() => {
                showToast("Link copiado para a área de transferência!");
            }).catch(() => {
                showToast("Falha ao copiar o link.", "error");
            });
        });

        // Função para gerar QR Code com o link curto
        qrBtn.addEventListener('click', () => {
            const url = shortUrlInput.value;
            // Armazena o link no localStorage para a outra página pegar
            localStorage.setItem('qrLinkToGenerate', url);
            // Redireciona para a página principal
            window.location.href = 'index.html';
        });

        shortenBtn.addEventListener('click', shortenUrl);
        longUrlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                shortenUrl();
            }
        });

    </script>
</body>
</html>
